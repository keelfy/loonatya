  <style>
    :root { color-scheme: dark; --ink: #f4efff; --soft: #aaa4bd; --pink: #e3b5e0; }

    body { margin: 0; background: #100f1a; color: var(--ink); font-family: 'Trebuchet MS', Arial, sans-serif; -webkit-font-smoothing: antialiased; }

    .page::after { content: ''; position: absolute; inset: -80px; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 28% 25%, #9770d228, transparent 42%), radial-gradient(ellipse at 75% 65%, #d18cb71c, transparent 40%); animation: glow-drift 18s ease-in-out infinite alternate; }

    .description { display: block; font-size: 12px; color: #b9afc8; }

    .note { color: #a69bb4; font-size: 11px; letter-spacing: .3px; margin: 27px 0 0; }
    .note span { color: #d9afd5; margin-right: 6px; }
    footer { color: #8d829d; font-size: 10px; letter-spacing: 1px; padding-top: 20px; border-top: 1px solid #80709020; }
    .orbit { width: 690px; height: 690px; border: 1px solid #c29bd20b; border-radius: 50%; position: absolute; top: 44px; left: calc(50% - 345px); z-index: -1; }
    .orbit::before { content: ''; position: absolute; inset: -85px; border: 1px solid #c29bd208; border-radius: 50%; }
    .orbit { pointer-events: none; animation: orbit-turn 90s linear infinite; }
    .orbit::after { content: ''; position: absolute; top: 50%; left: -3px; width: 5px; height: 5px; border-radius: 50%; background: #d6b8ec99; box-shadow: 0 0 15px #c197e577; }
    .orbit-object { position: absolute; left: var(--x); top: var(--y); width: 6px; height: 6px; border-radius: 50%; background: #c8a9dd; opacity: .55; transform: translate(-50%, -50%); }
    .orbit-object.ring { width: 11px; height: 11px; border: 1px solid #cfb6e5; background: transparent; }
    .orbit-object.diamond { width: 7px; height: 7px; border-radius: 1px; background: #d8b4cf; transform: translate(-50%, -50%) rotate(45deg); }
    .orbit-object.spark { width: auto; height: auto; background: transparent; color: #e0c2e8; font-size: 16px; line-height: 1; }
    .orbit-outer { position: absolute; inset: -85px; border-radius: 50%; animation: orbit-turn 140s linear infinite reverse; }
    .star { position: absolute; color: #cbb2df; font-size: 15px; opacity: .6; pointer-events: none; }
    .star { animation: star-float 7s ease-in-out infinite alternate; }
    .s2 { animation-delay: -4s; animation-duration: 9s; }
    .s3 { animation-delay: -2s; animation-duration: 8s; }
    .s4 { animation-delay: -6s; animation-duration: 10s; }
    @keyframes glow-drift { from { transform: translate(-25px, -20px); opacity: .45; } to { transform: translate(35px, 30px); opacity: 1; } }
    @keyframes orbit-turn { to { transform: rotate(360deg); } }
    @keyframes star-float { from { transform: translateY(0) scale(.85); opacity: .25; } to { transform: translateY(-14px) scale(1.1); opacity: .75; } }
    .s1 { top: 29%; left: 19%; } .s2 { top: 18%; right: 22%; font-size: 9px; } .s3 { top: 65%; right: 17%; font-size: 19px; } .s4 { bottom: 22%; left: 24%; font-size: 8px; }
    @media (min-width: 1400px) { main { margin-top: 65px; margin-bottom: 80px; } }
    @media (max-width: 600px) { .page { padding: 25px 22px 22px; } main { margin-top: 42px; margin-bottom: 44px; } .link { padding: 16px 19px; } .s1 { left: 7%; top: 24%; } .s2 { right: 12%; top: 14%; } .s3, .s4 { display: none; } footer { font-size: 9px; letter-spacing: .4px; } }
    @media (prefers-reduced-motion: reduce) { .link, .link::after, .cursor-dots, .emblem { transition: none; } .link:hover { transform: none; } .page::after, .orbit, .orbit-outer, .star { animation: none; } }
  </style>

  <script>
    (() => {
      const page = document.querySelector('.page');
      const dots = document.querySelector('.cursor-dots');
      const motion = matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');
      let frame = 0;
      let activeCard = null;
      let point = null;

      function clearCard() {
        if (!activeCard) return;
        activeCard.classList.remove('is-pointed');
        for (const name of ['--pointer-x', '--pointer-y', '--tilt-x', '--tilt-y']) {
          activeCard.style.removeProperty(name);
        }
        activeCard = null;
      }

      function reset() {
        cancelAnimationFrame(frame);
        frame = 0;
        point = null;
        dots.classList.remove('is-active');
        clearCard();
      }

      page.addEventListener('pointermove', (event) => {
        if (!motion.matches || event.pointerType === 'touch') return;
        point = { x: event.clientX, y: event.clientY, card: event.target.closest('.link') };
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          if (!point || !motion.matches) return;
          const { x, y, card } = point;
          const bounds = card?.getBoundingClientRect();
          const pageBounds = page.getBoundingClientRect();
          dots.style.setProperty('--dot-x', `${x - pageBounds.left}px`);
          dots.style.setProperty('--dot-y', `${y - pageBounds.top}px`);
          dots.classList.add('is-active');
          if (activeCard !== card) clearCard();
          if (!card) return;
          activeCard = card;
          const horizontal = Math.max(0, Math.min(1, (x - bounds.left) / bounds.width));
          const vertical = Math.max(0, Math.min(1, (y - bounds.top) / bounds.height));
          card.style.setProperty('--pointer-x', `${horizontal * 100}%`);
          card.style.setProperty('--pointer-y', `${vertical * 100}%`);
          card.style.setProperty('--tilt-x', `${(0.5 - vertical) * 4}deg`);
          card.style.setProperty('--tilt-y', `${(horizontal - 0.5) * 4}deg`);
          card.classList.add('is-pointed');
        });
      }, { passive: true });
      page.addEventListener('pointerleave', reset);
      page.addEventListener('pointercancel', reset);
      window.addEventListener('blur', reset);
      window.addEventListener('scroll', reset, { passive: true });
      motion.addEventListener('change', reset);
      document.addEventListener('visibilitychange', () => { if (document.hidden) reset(); });
    })();
  </script>
